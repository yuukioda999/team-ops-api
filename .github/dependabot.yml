version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions that are used together (the Docker ones, checkout and setup-php) are tested together
    groups:
      actions:
        patterns: ["*"]
