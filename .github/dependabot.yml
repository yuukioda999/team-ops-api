version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PHP follows the production image (FrankenPHP, php8.4) and CI (8.4); raise all of them together by hand
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions that are used together (the Docker ones, checkout and setup-php) are tested together
    groups:
      actions:
        patterns: ["*"]
