    post:
      tags: [demo]
      operationId: switchDemoRole
      summary: デモの役割を切り替える
      description: 自分が作ったデモチームの、別の役割のデモユーザーとしてログインし直します。データはそのままです(AC-007-05)。
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRoleInput'
      responses:
        '200':
          description: 切り替えた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
