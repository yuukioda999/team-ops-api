openapi: 3.1.0
info:
  title: team-ops API
  version: 0.1.0
  summary: 少年サッカーチーム運営ツールの API(Web 画面から呼ぶ)
  description: |
    Web 画面(team-ops-web)だけが呼ぶ API です。Web 画面の型はこのファイルから生成します。

    ## 認証(ADR-0008)
    Laravel Sanctum の SPA 認証です。Web 画面と同じオリジンから Cookie のセッションで呼びます。
    1. `GET /api/sanctum/csrf-cookie` で `XSRF-TOKEN` Cookie を受け取る
    2. 変更を伴うリクエストには、その値を `X-XSRF-TOKEN` ヘッダーに入れる
    3. ログインはメールのリンク(マジックリンク)で行う。パスワードはない

    ## チーム(ADR-0009)
    チームのデータはすべて `/api/teams/{team}` の下にあります。所属していないチームは、存在していても 404 です。

    ## エラー
    すべて `{"message": "利用者向けの文言"}` の形です。422 のときだけ、項目ごとの `errors` が付きます。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5173
    description: ローカル(Vite が /api を API に転送する)
security:
  - session: []
tags:
  - name: auth
    description: ログインとアカウント
  - name: teams
    description: チーム
  - name: invitations
    description: 招待リンクと参加申請(002)
  - name: players
    description: 名簿と保護者の紐づけ(003)

paths:
  /api/sanctum/csrf-cookie:
    get:
      tags: [auth]
      operationId: getCsrfCookie
      summary: CSRF 対策の Cookie を受け取る
      security: []
      responses:
        '204':
          description: XSRF-TOKEN Cookie を設定した

  /api/auth/login-links:
    post:
      tags: [auth]
      operationId: requestLoginLink
      summary: ログイン用リンクをメールで送る
      description: |
        登録済みかどうかにかかわらず、同じ応答を返します(AC-001-01・02)。
        同じメールアドレスで1時間に6回以上要求すると 429 になり、メールは送りません(AC-001-05)。
        `return_to` を付けると、リンクでログインしたときの応答で同じ値を返します(AC-001-19)。
        受け付けるのは `/join?token=...` と `/settings/email/verify?token=...` の形だけで、それ以外は無視します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginLinkInput'
      responses:
        '202':
          description: メールを送った(送ることにした)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login-links/consume:
    post:
      tags: [auth]
      operationId: consumeLoginLink
      summary: メールのリンクでログインする
      description: |
        リンクは15分で失効し、1回だけ使えます(AC-001-03・04)。
        Web と同じオリジンからでない呼び出し(セッションがない)は 419 になり、リンクは使用済みになりません。
        未登録のメールアドレスなら、このときアカウントを作ります。`needs_display_name` が true なら表示名の入力画面に進みます。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: ログインした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '410':
          $ref: '#/components/responses/LinkExpired'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウトする
      responses:
        '204':
          description: ログアウトした(AC-001-06)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の利用者と、所属するチームの一覧
      description: どのチームにも所属していなければ `teams` は空です(AC-001-14)。
      responses:
        '200':
          description: 利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [auth]
      operationId: updateMe
      summary: 表示名を登録・変更する
      description: 初回の登録では、これでアカウントの登録が完了します(AC-001-08)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayNameInput'
      responses:
        '200':
          description: 更新後の利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/me/email-changes:
    post:
      tags: [auth]
      operationId: requestEmailChange
      summary: メールアドレスの変更を申請する
      description: |
        新しいアドレスに確認メールを送ります。リンクを開くまでは旧アドレスのままです(AC-001-09)。
        前の申請のリンクは、この時点で使えなくなります。今と同じアドレスは 422(`errors.new_email`)です。
        新しいアドレスが別のアカウントで使われていても同じ応答を返し、そのアドレスには変更できない旨だけを知らせます(AC-001-15)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEmailInput'
      responses:
        '202':
          description: 確認メールを送った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/me/email-changes/consume:
    post:
      tags: [auth]
      operationId: confirmEmailChange
      summary: 確認メールのリンクでメールアドレスの変更を確定する
      description: |
        申請した本人がログインしているときだけ確定できます(新しいアドレスを打ち間違えても、その宛先の持ち主に乗っ取られないため)。
        他人の申請のリンクは、期限切れと同じ 410 になり、使用済みにもなりません。
        変更すると、旧アドレスに「メールアドレスが変更されました」と知らせ、この端末以外のセッションと、まだ使われていない旧アドレス宛てのリンクを無効にします(AC-001-10・16)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: 変更した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '409':
          description: 確認の間に、新しいアドレスが別のアカウントで使われた(AC-001-17)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          $ref: '#/components/responses/LinkExpired'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams:
    post:
      tags: [teams]
      operationId: createTeam
      summary: チームを作成する
      description: |
        作成者がそのチームの代表になります。1人が代表として作成できるのは5チームまでです(AC-001-11・12)。
        上限を超えたときは 422 で、理由は `errors.team` に入ります。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamInput'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: チームの情報
      responses:
        '200':
          description: チームの情報と、自分の役割
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/invitation:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [invitations]
      operationId: getInvitation
      summary: 今の招待リンク
      description: 代表・役員だけ(AC-002-01・04)。有効なリンクがなければ `invitation` は null です。
      responses:
        '200':
          description: 今の招待リンク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [invitations]
      operationId: issueInvitation
      summary: 招待リンクを発行する
      description: 有効期限は7日。チームで有効なリンクは1つなので、古いリンクは無効になります(AC-002-01・02)。
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: 招待リンクを無効にする
      description: 以後そのリンクからは申請できません(AC-002-03)。有効なリンクがなくても 204 です。
      responses:
        '204':
          description: 無効にした
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/teams/{team}/join-requests:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [invitations]
      operationId: listJoinRequests
      summary: 承認待ちの申請の一覧
      description: 代表・役員だけ。申請日時の古い順です(AC-002-11)。
      responses:
        '200':
          description: 承認待ちの申請
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [join_requests]
                properties:
                  join_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/JoinRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/join-requests/{joinRequest}/approve:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [invitations]
      operationId: approveJoinRequest
      summary: 申請を承認する
      description: 役割は保護者・コーチから選びます(複数可)。役員・代表は 422 です(AC-002-12・14)。承認されたことを本人にメールで知らせます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveJoinRequestInput'
      responses:
        '204':
          description: 承認した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 承認待ちの申請がない(承認・却下済みを含む)、または所属していないチーム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/join-requests/{joinRequest}/reject:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [invitations]
      operationId: rejectJoinRequest
      summary: 申請を却下する
      description: 申請者には通知しません。申請者の画面には「承認されませんでした」と表示されます(AC-002-13)。
      responses:
        '204':
          description: 却下した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 承認待ちの申請がない(承認・却下済みを含む)、または所属していないチーム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/teams/{team}/players:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [players]
      operationId: listPlayers
      summary: 名簿
      description: 代表・役員・コーチは全選手、保護者は自分に紐づく選手だけ(AC-003-08・09)。学年・背番号の順。開くたびに監査ログに残します(AC-003-11)。
      parameters:
        - name: grade
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Grade'
        - name: number
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 999
      responses:
        '200':
          description: 名簿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roster'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [players]
      operationId: createPlayer
      summary: 選手を登録する
      description: 代表・役員だけ。同じ表示名・同じ学年の選手がいても登録し、possible_duplicate を true にします(AC-003-03)。1チーム200人まで(AC-003-04)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerInput'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/players/{player}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PlayerId'
    get:
      tags: [players]
      operationId: getPlayer
      summary: 選手の詳細
      description: 保護者が自分に紐づかない選手を指定すると、存在しない場合と同じ404です(AC-003-10)。
      responses:
        '200':
          description: 選手
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [players]
      operationId: updatePlayer
      summary: 選手の情報を編集する
      description: 代表・役員だけ。送った項目だけを変えます(AC-003-02)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerChanges'
      responses:
        '200':
          description: 編集した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [players]
      operationId: deletePlayer
      summary: 選手を削除する
      description: 代表・役員だけ。行ごと消し、保護者との紐づけも外れます(AC-003-02)。
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/teams/{team}/players/{player}/guardians:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PlayerId'
    put:
      tags: [players]
      operationId: replacePlayerGuardians
      summary: 紐づける保護者を置き換える
      description: 代表・役員だけ。保護者の役割を持つメンバーを4人まで(AC-003-05・07)。空の配列ですべて外します(AC-003-06)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiansInput'
      responses:
        '200':
          description: 置き換えた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/guardian-candidates:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [players]
      operationId: listGuardianCandidates
      summary: 紐づけられるメンバー
      description: 代表・役員だけ。保護者の役割を持つメンバーだけを返します(AC-003-07)。
      responses:
        '200':
          description: 候補
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Guardian'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/players/import/template:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [players]
      operationId: getPlayerImportTemplate
      summary: 取り込み用のテンプレート CSV
      description: 代表・役員だけ。見出し(表示名,学年,背番号)と記入例1行。UTF-8(BOM付き)です(AC-003-13)。
      responses:
        '200':
          description: テンプレート
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/players/import/preview:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [players]
      operationId: previewPlayerImport
      summary: CSV を確認する
      description: |
        代表・役員だけ。登録はしません(AC-003-14)。行のエラーと重複の警告を返します(AC-003-15・21)。確認したことを監査ログに残します(件数だけ)。
        確認と確定は、合わせて1人1分に10回までです。
        文字コード・1MB・500行・見出しの問題は 422 です(AC-003-16・17)。確定には、返した file_hash と同じファイルを送ります(ADR-0014)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlayerCsvInput'
      responses:
        '200':
          description: 確認の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerImportPreview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams/{team}/players/import:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [players]
      operationId: importPlayers
      summary: CSV の取り込みを確定する
      description: |
        代表・役員だけ。確認したファイルと同じか(file_hash)を確かめ、もう一度すべて調べてから一括で登録します。
        1件でもエラーがあれば1件も登録せず、422 の errors.file にエラーを返します(AC-003-15)。取り込んだ件数を監査ログに残します(AC-003-19)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlayerCsvInput'
                - type: object
                  required: [file_hash]
                  properties:
                    file_hash:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                      description: 確認の応答の file_hash
      responses:
        '201':
          description: 取り込んだ
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [imported]
                properties:
                  imported:
                    type: integer
                    description: 登録した選手の数
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: 招待リンクのチーム名
      description: |
        ログインは不要です(AC-002-05)。トークンは URL ではなく本文で渡します。
        期限切れ・無効化・存在しないリンクは、区別せず 410 です(AC-002-07)。
        ログイン中なら `relation` に、そのチームとの関係(member / pending / none)が入ります。メンバーなら `team_id` も入ります(AC-002-08)。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: リンクのチーム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '410':
          $ref: '#/components/responses/InvalidInvitation'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/invitations/applications:
    post:
      tags: [invitations]
      operationId: applyToTeam
      summary: 招待リンクから参加を申請する
      description: |
        申請は「承認待ち」になり、代表・役員にメールで知らせます(AC-002-06)。表示名はアカウントの表示名になります。
        すでに承認待ちなら新しい申請は作らず 200 です(AC-002-09)。却下・取り消しのあとは再申請できます(AC-002-16)。
        すでにメンバーなら 409 で、`team_id` にチームのIDが入ります(AC-002-08)。
        1つのリンクに24時間で50件を超える申請があると 429 です(AC-002-10)。
        同じ人が同じチームへ24時間に申請できるのは3回までで、超えると 429 です(AC-002-18)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestInput'
      responses:
        '201':
          description: 申請した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitted'
        '200':
          description: すでに承認待ちの申請がある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: すでにこのチームのメンバー
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, team_id]
                properties:
                  message:
                    type: string
                  team_id:
                    type: string
        '410':
          $ref: '#/components/responses/InvalidInvitation'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: team-ops-api-session
      description: Sanctum の SPA 認証のセッション Cookie。変更を伴うリクエストには X-XSRF-TOKEN ヘッダーも必要

  parameters:
    TeamId:
      name: team
      in: path
      required: true
      description: チームID(ULID)
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
    PlayerId:
      name: player
      in: path
      required: true
      description: 選手のID
      schema:
        type: integer
    JoinRequestId:
      name: joinRequest
      in: path
      required: true
      description: 参加申請のID
      schema:
        type: integer

  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: 利用者向けの文言

    ValidationError:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          description: 項目名ごとのエラーの文言
          additionalProperties:
            type: array
            items:
              type: string

    LoginLinkInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 半角(ASCII)のアドレスだけ。前後の空白は除き、小文字にそろえて扱う
        return_to:
          type: [string, 'null']
          maxLength: 512
          description: ログイン後に戻る先(AC-001-19)。`/join?token=...` と `/settings/email/verify?token=...` の形だけを受け付け、それ以外は無視する

    NewEmailInput:
      type: object
      required: [new_email]
      properties:
        new_email:
          type: string
          format: email
          maxLength: 254
          description: 半角(ASCII)のアドレスだけ。前後の空白は除き、小文字にそろえて扱う

    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: メールのリンクの token の値
          maxLength: 128

    DisplayNameInput:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない

    CreateTeamInput:
      type: object
      required: [name, sport]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない
        sport:
          $ref: '#/components/schemas/Sport'

    Sport:
      type: string
      enum: [soccer, baseball, other]

    TeamRole:
      type: string
      description: 代表・役員・コーチ・保護者。1人が複数持てる(ADR-0011)
      enum: [representative, officer, coach, parent]

    JoinRequestStatus:
      type: string
      description: 承認待ち・承認・却下・自動取り消し
      enum: [pending, approved, rejected, cancelled]

    Me:
      type: object
      additionalProperties: false
      required: [email, display_name, needs_display_name, teams, join_requests]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: [string, 'null']
          description: 初回ログイン直後は null
        needs_display_name:
          type: boolean
          description: true なら表示名の入力画面に進む
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
        join_requests:
          type: array
          description: 自分の参加申請のうち、承認待ちと承認されなかったもの(AC-002-09・13)。承認されたものは teams に入る
          items:
            $ref: '#/components/schemas/MyJoinRequest'

    LoginResult:
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          required: [return_to]
          properties:
            return_to:
              type: [string, 'null']
              description: ログイン後に進む先(AC-001-19)。ログイン用リンクの要求で受け付けた値

    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, sport, roles]
      properties:
        id:
          type: string
        name:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TeamRole'

    Team:
      type: object
      additionalProperties: false
      required: [id, name, sport, roles, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        roles:
          type: array
          description: 自分の役割
          items:
            $ref: '#/components/schemas/TeamRole'
        permissions:
          type: object
          additionalProperties: false
          description: 画面の出し分け用。判定は API の TeamPolicy と同じ
          required: [manage_invitation, review_join_requests, manage_players, view_players, view_all_players]
          properties:
            manage_invitation:
              type: boolean
            review_join_requests:
              type: boolean
            manage_players:
              type: boolean
              description: 選手の登録・編集・削除、保護者の紐づけ、CSV の取り込み(代表・役員)
            view_players:
              type: boolean
              description: 名簿を開ける(代表・役員・コーチ・保護者)
            view_all_players:
              type: boolean
              description: 全選手の名簿を見られる(代表・役員・コーチ)。false なら自分に紐づく選手だけ

    MyJoinRequest:
      type: object
      additionalProperties: false
      required: [id, team_name, status, created_at]
      properties:
        id:
          type: integer
        team_name:
          type: string
        status:
          $ref: '#/components/schemas/JoinRequestStatus'
        created_at:
          type: string
          format: date-time

    Invitation:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: 招待リンク。画面はこの URL から QR コードを作る
        expires_at:
          type: string
          format: date-time

    InvitationEnvelope:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          oneOf:
            - $ref: '#/components/schemas/Invitation'
            - type: 'null'

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [team, relation, team_id]
      properties:
        team:
          type: object
          additionalProperties: false
          required: [name, sport]
          properties:
            name:
              type: string
            sport:
              $ref: '#/components/schemas/Sport'
        relation:
          type: [string, 'null']
          enum: [member, pending, none, null]
          description: ログイン中のときだけ。そのチームとの関係
        team_id:
          type: [string, 'null']
          description: メンバーのときだけ。チームの画面へ進むため

    JoinRequestInput:
      type: object
      required: [token, display_name]
      properties:
        token:
          type: string
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: アカウントの表示名になる(全チーム共通)
        message:
          type: [string, 'null']
          maxLength: 100
          description: ひとこと(任意)。例:「○年 △△の母です」

    JoinRequestSubmitted:
      type: object
      additionalProperties: false
      required: [status, team]
      properties:
        status:
          type: string
          enum: [pending]
        team:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string

    JoinRequest:
      type: object
      additionalProperties: false
      required: [id, display_name, message, created_at]
      properties:
        id:
          type: integer
        display_name:
          type: [string, 'null']
        message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    ApproveJoinRequestInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [parent, coach]

    Grade:
      type: string
      description: 未就学・小1〜小6・中1〜中3
      enum: [preschool, e1, e2, e3, e4, e5, e6, j1, j2, j3]

    Guardian:
      type: object
      additionalProperties: false
      required: [membership_id, display_name]
      properties:
        membership_id:
          type: integer
          description: チームのメンバーのID
        display_name:
          type: [string, 'null']

    Player:
      type: object
      additionalProperties: false
      required: [id, display_name, grade, number, guardians]
      properties:
        id:
          type: integer
        display_name:
          type: string
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          description: 背番号
        guardians:
          type: array
          description: 紐づく保護者。保護者が見る場合は、自分の子どもに紐づく保護者だけ
          items:
            $ref: '#/components/schemas/Guardian'

    Roster:
      type: object
      additionalProperties: false
      required: [scope, players]
      properties:
        scope:
          type: string
          enum: [all, own]
          description: all は全選手、own は自分に紐づく選手だけ
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'

    PlayerEnvelope:
      type: object
      additionalProperties: false
      required: [player]
      properties:
        player:
          $ref: '#/components/schemas/Player'

    PlayerCreated:
      type: object
      additionalProperties: false
      required: [player, possible_duplicate]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        possible_duplicate:
          type: boolean
          description: 同じ表示名・同じ学年の選手がすでにいた(AC-003-03)

    PlayerInput:
      type: object
      required: [display_name, grade]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          minimum: 0
          maximum: 999

    PlayerChanges:
      type: object
      description: 送った項目だけを変える
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          minimum: 0
          maximum: 999

    GuardiansInput:
      type: object
      required: [membership_ids]
      properties:
        membership_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: integer

    PlayerCsvInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: CSV(UTF-8 か Shift_JIS、1MB・500行まで)。見出しは「表示名,学年,背番号」

    CsvProblem:
      type: object
      additionalProperties: false
      required: [line, column, message]
      properties:
        line:
          type: [integer, 'null']
          description: 行番号(見出しが1行目)。ファイル全体の問題は null
        column:
          type: [string, 'null']
          description: 列の見出し
        message:
          type: string
          description: 例:「3行目 学年:『小7』は選べません(未就学、小1〜小6、中1〜中3)」

    PlayerImportPreview:
      type: object
      additionalProperties: false
      required: [file_hash, count, rows, errors, warnings]
      properties:
        file_hash:
          type: string
          description: 確定のときに送る、このファイルの SHA-256
        count:
          type: integer
          description: 取り込める行の数
        rows:
          type: array
          description: 先頭10行
          items:
            type: object
            additionalProperties: false
            required: [line, display_name, grade, number]
            properties:
              line:
                type: integer
              display_name:
                type: string
              grade:
                $ref: '#/components/schemas/Grade'
              number:
                type: [integer, 'null']
        errors:
          type: array
          description: 1件でもあれば確定できない
          items:
            $ref: '#/components/schemas/CsvProblem'
        warnings:
          type: array
          description: 重複の可能性(確定はできる。AC-003-21)
          items:
            $ref: '#/components/schemas/CsvProblem'

  responses:
    Unauthenticated:
      description: ログインしていない、またはセッションが切れた(AC-000-02、AC-001-07)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: この操作の権限がない(代表・役員だけの操作など。AC-002-04)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    InvalidInvitation:
      description: 招待リンクが期限切れ・無効化・存在しない(区別しない。AC-002-07)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: 存在しない、または所属していないチーム(区別しない。AC-000-01)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    LinkExpired:
      description: リンクの期限切れ・使用済み・不正(区別しない。AC-001-04)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    CsrfExpired:
      description: CSRF のトークンがない、または古い。csrf-cookie を取り直して再送する
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ValidationFailed:
      description: 入力値が仕様に合わない(AC-000-05)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: 回数の上限を超えた。Retry-After 秒後に再試行できる
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
