        訪問者専用のデモチームを作り、選んだ役割のデモユーザーとしてログインします(AC-007-02)。デモチームは24時間で消えます。
        IP ごとに1時間20回まで(AC-007-09)。存在するデモチームが500以上なら 503 です(AC-007-10)。デモモードでなければ404です。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRoleInput'
      responses:
        '201':
          description: ログインした
          content:
            application/json:
              schema:
