      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [players]
      operationId: getPlayerImportSample
      summary: 取り込みを試すためのサンプル CSV
      description: 代表・役員だけ。架空の選手20人分です(AC-007-16)。UTF-8(BOM付き)です。
      responses:
        '200':
          description: サンプル
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/players/import/preview:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [players]
      operationId: previewPlayerImport
      summary: CSV を確認する
      description: |
        代表・役員だけ。登録はしません(AC-003-14)。行のエラーと重複の警告を返します(AC-003-15・21)。確認したことを監査ログに残します(件数だけ)。
        確認と確定は、合わせて1人1分に10回までです。
        文字コード・1MB・500行・見出しの問題は 422 です(AC-003-16・17)。確定には、返した file_hash と同じファイルを送ります(ADR-0014)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlayerCsvInput'
      responses:
        '200':
          description: 確認の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerImportPreview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams/{team}/players/import:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [players]
      operationId: importPlayers
      summary: CSV の取り込みを確定する
      description: |
        代表・役員だけ。確認したファイルと同じか(file_hash)を確かめ、もう一度すべて調べてから一括で登録します。
        1件でもエラーがあれば1件も登録せず、422 の errors.file にエラーを返します(AC-003-15)。取り込んだ件数を監査ログに残します(AC-003-19)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlayerCsvInput'
                - type: object
                  required: [file_hash]
                  properties:
                    file_hash:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                      description: 確認の応答の file_hash
      responses:
        '201':
          description: 取り込んだ
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [imported]
                properties:
                  imported:
                    type: integer
                    description: 登録した選手の数
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/internal/notify-relay/events:
    post:
      tags: [internal]
      operationId: receiveRelayEvent
      summary: notify-relay からの送信結果(webhook)
      description: |
        notify-relay の deliveryResults・deliveryCompleted の受け口です(ADR-0019)。セッションではなく署名で確かめ、違えば 401 です。
        同じ `event_id` は2回処理せず、204 を返します。お知らせのメールなら、宛先ごとの状態を更新します(AC-006-08)。
      security:
        - relaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayEvent'
      responses:
        '204':
          description: 受け取った(重複していた場合も)
        '400':
          description: 時刻がないか、5分を超えてずれている(notify-relay は送り直す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '413':
          description: 本文が1MBを超える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: 受け取る側の鍵が設定されていない(notify-relay は送り直す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: 鍵IDか署名が正しくない(notify-relay は送り直さず、鍵の設定ミスとしてアラートを出す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: 招待リンクのチーム名
      description: |
        ログインは不要です(AC-002-05)。トークンは URL ではなく本文で渡します。
        期限切れ・無効化・存在しないリンクは、区別せず 410 です(AC-002-07)。
        ログイン中なら `relation` に、そのチームとの関係(member / pending / none)が入ります。メンバーなら `team_id` も入ります(AC-002-08)。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: リンクのチーム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '410':
          $ref: '#/components/responses/InvalidInvitation'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/invitations/applications:
    post:
      tags: [invitations]
      operationId: applyToTeam
      summary: 招待リンクから参加を申請する
      description: |
        申請は「承認待ち」になり、代表・役員にメールで知らせます(AC-002-06)。表示名はアカウントの表示名になります。
        すでに承認待ちなら新しい申請は作らず 200 です(AC-002-09)。却下・取り消しのあとは再申請できます(AC-002-16)。
        すでにメンバーなら 409 で、`team_id` にチームのIDが入ります(AC-002-08)。
        1つのリンクに24時間で50件を超える申請があると 429 です(AC-002-10)。
        同じ人が同じチームへ24時間に申請できるのは3回までで、超えると 429 です(AC-002-18)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '201':
          description: 申請した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitted'
        '200':
          description: すでに承認待ちの申請がある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: すでにこのチームのメンバー
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, team_id]
                properties:
                  message:
                    type: string
                  team_id:
                    type: string
        '410':
          $ref: '#/components/responses/InvalidInvitation'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: team-ops-api-session
      description: Sanctum の SPA 認証のセッション Cookie。変更を伴うリクエストには X-XSRF-TOKEN ヘッダーも必要
    relaySignature:
      type: apiKey
      in: header
      name: X-Relay-Signature
      description: notify-relay の webhook の署名(notify-relay api/openapi.yaml と同じ方式)。X-Relay-Key-Id と X-Relay-Timestamp も必要

  parameters:
    TeamId:
      name: team
      in: path
      required: true
      description: チームID(ULID)
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
    MembershipId:
      name: membership
      in: path
      required: true
      description: チームのメンバーのID
      schema:
        type: integer
    NoticeId:
      name: notice
      in: path
      required: true
      description: お知らせのID
      schema:
        type: integer
    PlayerId:
      name: player
      in: path
      required: true
      description: 選手のID
      schema:
        type: integer
    JoinRequestId:
      name: joinRequest
      in: path
      required: true
      description: 参加申請のID
      schema:
        type: integer

  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: 利用者向けの文言
        reason:
          type: string
          enum: [demo_mode, demo_expired]
          description: 画面が表示を変えるための理由(demo_mode:デモ環境では使えない、demo_expired:デモの有効期限が切れた)

    ValidationError:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          description: 項目名ごとのエラーの文言
          additionalProperties:
            type: array
            items:
              type: string

    LoginLinkInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 半角(ASCII)のアドレスだけ。前後の空白は除き、小文字にそろえて扱う
        return_to:
          type: [string, 'null']
          maxLength: 512
          description: ログイン後に戻る先(AC-001-19)。`/join?token=...` と `/settings/email/verify?token=...` の形だけを受け付け、それ以外は無視する

    NewEmailInput:
      type: object
      required: [new_email]
      properties:
        new_email:
          type: string
          format: email
          maxLength: 254
          description: 半角(ASCII)のアドレスだけ。前後の空白は除き、小文字にそろえて扱う

    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: メールのリンクの token の値
          maxLength: 128

    DisplayNameInput:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない

    CreateTeamInput:
      type: object
      required: [name, sport]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない
        sport:
          $ref: '#/components/schemas/Sport'

    NoticeTargetInput:
      type: object
      required: [type, values]
      description: 全員なら values は空。学年・役割なら1つ以上。学年と役割は同時に指定できない
      properties:
        type:
          type: string
          enum: [all, grades, roles]
        values:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            description: 学年(preschool, e1〜e6, j1〜j3)または役割(representative, officer, coach, parent)

    NoticeInput:
      type: object
      required: [title, body, target]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 1行。前後の空白は取り除く
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: 改行できる。HTML として解釈しない
        target:
          $ref: '#/components/schemas/NoticeTargetInput'
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: 予約日時(時差付き)。null または省略なら今すぐ送信

    NoticeChanges:
      type: object
      description: 送った項目だけを変える
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          minLength: 1
          maxLength: 2000
        target:
          $ref: '#/components/schemas/NoticeTargetInput'
        scheduled_at:
          type: string
          format: date-time

    Notice:
      type: object
      additionalProperties: false
      required: [id, title, body, target, status, scheduled_at, published_at, recipient_count, author_display_name, unread, mine]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        target:
          type: object
          additionalProperties: false
          required: [type, values]
          properties:
            type:
              type: string
              enum: [all, grades, roles]
            values:
              type: array
              items:
                type: string
        status:
          type: string
          enum: [scheduled, published, cancelled]
        scheduled_at:
          type: [string, 'null']
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        recipient_count:
          type: integer
          description: 公開の時点で届いた人数(予約中は0)
        author_display_name:
          type: [string, 'null']
        unread:
          type: boolean
          description: 自分宛ての一覧で、まだ開いていない(AC-006-03)。それ以外は false
        mine:
          type: boolean
          description: 自分が作成した。画面で配信状況への導線を出すかに使う(判定は API で行う)

    NoticeDeliveryStatus:
      type: object
      additionalProperties: false
      required: [title, state, recipients, read, unread, unread_members, delivered, pending, failed, skipped, reminders]
      properties:
        title:
          type: string
          description: お知らせの題名(状況の画面は詳細を開かずに出す。詳細を開くと既読になるため)
        state:
          type: string
          enum: [sending, done]
        recipients:
          type: integer
          description: 送信時点の宛先数
        read:
          type: integer
        unread:
          type: integer
        unread_members:
          type: integer
          description: 未読のうち今もチームにいる人(再通知が届く人)
        delivered:
          type: integer
          description: 送信済み(受信側のサーバーが受け付けた)
        pending:
          type: integer
          description: 送信待ち
        failed:
          type: integer
        skipped:
          type: integer
          description: 送らなかった
        reminders:
          type: object
          additionalProperties: false
          required: [sent, max, available, reason, next_available_at]
          properties:
            sent:
              type: integer
            max:
              type: integer
            available:
              type: boolean
            reason:
              type: [string, 'null']
              enum: [interval, max, no_unread, null]
            next_available_at:
              type: [string, 'null']
              format: date-time
              description: reason が interval のとき、次に実行できる時刻

    NoticeRecipientName:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: [string, 'null']

    NoticeFailedRecipient:
      type: object
      additionalProperties: false
      required: [display_name, status, reason]
      properties:
        display_name:
          type: [string, 'null']
        status:
          type: string
          enum: [failed, skipped]
        reason:
          type: [string, 'null']

    RelayEvent:
      type: object
      required: [event_id, type, delivery_id, dedupe_key]
      properties:
        event_id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        type:
          type: string
          enum: [delivery.results, delivery.completed]
        delivery_id:
          type: string
          pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$'
        dedupe_key:
          type: string
        results:
          type: array
          maxItems: 500
          items:
            type: object
            required: [recipient_ref, status, occurred_at]
            properties:
              recipient_ref:
                type: string
              status:
                type: string
                enum: [delivered, failed, skipped]
              error_code:
                type: [string, 'null']
              attempts:
                type: integer
              occurred_at:
                type: string
                format: date-time
        counts:
          type: object
          properties:
            delivered:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
        completed_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time

    NoticeEnvelope:
      type: object
      additionalProperties: false
      required: [notice]
      properties:
        notice:
          $ref: '#/components/schemas/Notice'

    NoticeList:
      type: object
      additionalProperties: false
      required: [notices]
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'

    MyNoticeList:
      type: object
      additionalProperties: false
      required: [notices, next_before]
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        next_before:
          type: [integer, 'null']
          description: 続きがあるとき、次に before に渡す値。なければ null

    UpdateTeamInput:
      type: object
      description: 送った項目だけを変える
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sport:
          $ref: '#/components/schemas/Sport'

    Member:
      type: object
      additionalProperties: false
      required: [membership_id, display_name, roles, is_me]
      properties:
        membership_id:
          type: integer
        display_name:
          type: [string, 'null']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TeamRole'
        is_me:
          type: boolean
          description: 自分自身か

    MemberEnvelope:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/Member'

    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, created_at, action, action_label, actor, actor_display_name]
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        action:
          type: string
          description: 操作の種類(例:member.roles_changed)
        action_label:
          type: string
          description: 操作の種類の日本語(例:メンバーの役割を変更)
        actor:
          type: string
          enum: [member, former]
          description: member は今のメンバー、former はすでにチームにいない人(アカウントが消えた人を含む)
        actor_display_name:
          type: [string, 'null']
          description: actor が member のときだけ

    Sport:
      type: string
      enum: [soccer, baseball, other]

    TeamRole:
      type: string
      description: 代表・役員・コーチ・保護者。1人が複数持てる(ADR-0011)
      enum: [representative, officer, coach, parent]

    JoinRequestStatus:
      type: string
      description: 承認待ち・承認・却下・自動取り消し
      enum: [pending, approved, rejected, cancelled]

    Me:
      type: object
      additionalProperties: false
      required: [email, display_name, needs_display_name, email_undeliverable, demo_team_id, teams, join_requests]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: [string, 'null']
          description: 初回ログイン直後は null
        needs_display_name:
          type: boolean
          description: true なら表示名の入力画面に進む
        email_undeliverable:
          type: boolean
          description: お知らせのメールがアドレスの問題で届かなかった。アドレスを変えるまでお知らせのメールを送らない(AC-006-16・17)
        demo_team_id:
          type: [string, 'null']
          description: デモユーザーなら属するデモチーム(007)。通常のユーザーは null
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
        join_requests:
          type: array
          description: 自分の参加申請のうち、承認待ちと承認されなかったもの(AC-002-09・13)。承認されたものは teams に入る
          items:
            $ref: '#/components/schemas/MyJoinRequest'

    LoginResult:
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          required: [return_to]
          properties:
            return_to:
              type: [string, 'null']
              description: ログイン後に進む先(AC-001-19)。ログイン用リンクの要求で受け付けた値

    DemoRoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [representative, officer, coach, parent]

    DemoLoginResult:
      $ref: '#/components/schemas/Me'

    DemoMail:
      type: object
      additionalProperties: false
      required: [subject, to, sent_at, text]
      properties:
        subject:
          type: string
        to:
          type: array
          items:
            type: string
        sent_at:
          type: string
          description: 受け止め先に届いた日時
        text:
          type: string

    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, sport, roles]
      properties:
        id:
          type: string
        name:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TeamRole'

    Team:
      type: object
      additionalProperties: false
      required: [id, name, sport, roles, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        roles:
          type: array
          description: 自分の役割
          items:
            $ref: '#/components/schemas/TeamRole'
        permissions:
          type: object
          additionalProperties: false
          description: 画面の出し分け用。判定は API の TeamPolicy と同じ
          required: [manage_invitation, review_join_requests, manage_players, view_players, view_all_players, update_team, view_members, manage_roles, remove_members, view_audit_logs, create_notices, manage_all_notices]
          properties:
            manage_invitation:
              type: boolean
            review_join_requests:
              type: boolean
            manage_players:
              type: boolean
              description: 選手の登録・編集・削除、保護者の紐づけ、CSV の取り込み(代表・役員)
            update_team:
              type: boolean
              description: チーム名・競技を変えられる(代表)
            view_members:
              type: boolean
              description: メンバー一覧を見られる(代表・役員)
            manage_roles:
              type: boolean
              description: 役割の変更と代表の交代ができる(代表)
            remove_members:
              type: boolean
              description: メンバーを除名できる(代表・役員。役員は代表と役員を除名できない)
            view_audit_logs:
              type: boolean
              description: 監査ログを見られる(代表)
            create_notices:
              type: boolean
              description: お知らせを作成・送信・予約できる(代表・役員・コーチ)
            manage_all_notices:
              type: boolean
              description: チームのすべての予約中のお知らせを編集・取り消しできる(代表・役員)。false なら自分が作ったものだけ
            view_players:
              type: boolean
              description: 名簿を開ける(代表・役員・コーチ・保護者)
            view_all_players:
              type: boolean
              description: 全選手の名簿を見られる(代表・役員・コーチ)。false なら自分に紐づく選手だけ

    MyJoinRequest:
      type: object
      additionalProperties: false
      required: [id, team_name, status, created_at]
      properties:
        id:
          type: integer
        team_name:
          type: string
        status:
          $ref: '#/components/schemas/JoinRequestStatus'
        created_at:
          type: string
          format: date-time

    Invitation:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: 招待リンク。画面はこの URL から QR コードを作る
        expires_at:
          type: string
          format: date-time

    InvitationEnvelope:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          oneOf:
            - $ref: '#/components/schemas/Invitation'
            - type: 'null'

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [team, relation, team_id]
      properties:
        team:
          type: object
          additionalProperties: false
          required: [name, sport]
          properties:
            name:
              type: string
            sport:
              $ref: '#/components/schemas/Sport'
        relation:
          type: [string, 'null']
          enum: [member, pending, none, null]
          description: ログイン中のときだけ。そのチームとの関係
        team_id:
          type: [string, 'null']
          description: メンバーのときだけ。チームの画面へ進むため

    JoinRequestInput:
      type: object
      required: [token, display_name]
      properties:
        token:
          type: string
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: アカウントの表示名になる(全チーム共通)
        message:
          type: [string, 'null']
          maxLength: 100
          description: ひとこと(任意)。例:「○年 △△の母です」

    JoinRequestSubmitted:
      type: object
      additionalProperties: false
      required: [status, team]
      properties:
        status:
          type: string
          enum: [pending]
        team:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string

    JoinRequest:
      type: object
      additionalProperties: false
      required: [id, display_name, message, created_at]
      properties:
        id:
          type: integer
        display_name:
          type: [string, 'null']
        message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    ApproveJoinRequestInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [parent, coach]

    Grade:
      type: string
      description: 未就学・小1〜小6・中1〜中3
      enum: [preschool, e1, e2, e3, e4, e5, e6, j1, j2, j3]

    Guardian:
      type: object
      additionalProperties: false
      required: [membership_id, display_name]
      properties:
        membership_id:
          type: integer
          description: チームのメンバーのID
        display_name:
          type: [string, 'null']

    Player:
      type: object
      additionalProperties: false
      required: [id, display_name, grade, number, guardians]
      properties:
        id:
          type: integer
        display_name:
          type: string
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          description: 背番号
        guardians:
          type: array
          description: 紐づく保護者。保護者が見る場合は、自分の子どもに紐づく保護者だけ
          items:
            $ref: '#/components/schemas/Guardian'

    Roster:
      type: object
      additionalProperties: false
      required: [scope, players]
      properties:
        scope:
          type: string
          enum: [all, own]
          description: all は全選手、own は自分に紐づく選手だけ
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'

    PlayerEnvelope:
      type: object
      additionalProperties: false
      required: [player]
      properties:
        player:
          $ref: '#/components/schemas/Player'

    PlayerCreated:
      type: object
      additionalProperties: false
      required: [player, possible_duplicate]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        possible_duplicate:
          type: boolean
          description: 同じ表示名・同じ学年の選手がすでにいた(AC-003-03)

    PlayerInput:
      type: object
      required: [display_name, grade]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白(全角を含む)は取り除く。改行などの制御文字は使えない
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          minimum: 0
          maximum: 999

    PlayerChanges:
      type: object
      description: 送った項目だけを変える
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 30
        grade:
          $ref: '#/components/schemas/Grade'
        number:
          type: [integer, 'null']
          minimum: 0
          maximum: 999

    GuardiansInput:
      type: object
      required: [membership_ids]
      properties:
        membership_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: integer

    PlayerCsvInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: CSV(UTF-8 か Shift_JIS、1MB・500行まで)。見出しは「表示名,学年,背番号」

    CsvProblem:
      type: object
      additionalProperties: false
      required: [line, column, message]
      properties:
        line:
          type: [integer, 'null']
          description: 行番号(見出しが1行目)。ファイル全体の問題は null
        column:
          type: [string, 'null']
          description: 列の見出し
        message:
          type: string
          description: 例:「3行目 学年:『小7』は選べません(未就学、小1〜小6、中1〜中3)」

    PlayerImportPreview:
      type: object
      additionalProperties: false
      required: [file_hash, count, rows, errors, warnings]
      properties:
        file_hash:
          type: string
          description: 確定のときに送る、このファイルの SHA-256
        count:
          type: integer
          description: 取り込める行の数
        rows:
          type: array
          description: 先頭10行
          items:
            type: object
            additionalProperties: false
            required: [line, display_name, grade, number]
            properties:
              line:
                type: integer
              display_name:
                type: string
              grade:
                $ref: '#/components/schemas/Grade'
              number:
                type: [integer, 'null']
        errors:
          type: array
          description: 1件でもあれば確定できない
          items:
            $ref: '#/components/schemas/CsvProblem'
        warnings:
          type: array
          description: 重複の可能性(確定はできる。AC-003-21)
          items:
            $ref: '#/components/schemas/CsvProblem'

  responses:
    ReminderUnavailable:
      description: 前回から1時間以内、3回済み、または未読の人がいない(AC-006-12・13・15)。`errors.reminder` に理由が入る
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NoticeNotScheduled:
      description: 送信済み・取り消し済みのお知らせは編集・取り消しできない(AC-005-06)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthenticated:
      description: ログインしていない、またはセッションが切れた(AC-000-02、AC-001-07)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    DemoMode:
      description: デモ環境では使えない操作(AC-007-03・14・15)。`reason` は demo_mode
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: この操作の権限がない(代表・役員だけの操作など。AC-002-04)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    InvalidInvitation:
      description: 招待リンクが期限切れ・無効化・存在しない(区別しない。AC-002-07)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: 存在しない、または所属していないチーム(区別しない。AC-000-01)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    LinkExpired:
      description: リンクの期限切れ・使用済み・不正(区別しない。AC-001-04)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    CsrfExpired:
      description: CSRF のトークンがない、または古い。csrf-cookie を取り直して再送する
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ValidationFailed:
      description: 入力値が仕様に合わない(AC-000-05)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: 回数の上限を超えた。Retry-After 秒後に再試行できる
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
