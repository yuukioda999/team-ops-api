openapi: 3.1.0
info:
  title: team-ops API
  version: 0.1.0
  summary: 少年サッカーチーム運営ツールの API(Web 画面から呼ぶ)
  description: |
    Web 画面(team-ops-web)だけが呼ぶ API です。Web 画面の型はこのファイルから生成します。

    ## 認証(ADR-0008)
    Laravel Sanctum の SPA 認証です。Web 画面と同じオリジンから Cookie のセッションで呼びます。
    1. `GET /api/sanctum/csrf-cookie` で `XSRF-TOKEN` Cookie を受け取る
    2. 変更を伴うリクエストには、その値を `X-XSRF-TOKEN` ヘッダーに入れる
    3. ログインはメールのリンク(マジックリンク)で行う。パスワードはない

    ## チーム(ADR-0009)
    チームのデータはすべて `/api/teams/{team}` の下にあります。所属していないチームは、存在していても 404 です。

    ## エラー
    すべて `{"message": "利用者向けの文言"}` の形です。422 のときだけ、項目ごとの `errors` が付きます。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5173
    description: ローカル(Vite が /api を API に転送する)
security:
  - session: []
tags:
  - name: auth
    description: ログインとアカウント
  - name: teams
    description: チーム
  - name: invitations
    description: 招待リンクと参加申請(002)
  - name: players
    description: 名簿と保護者の紐づけ(003)
  - name: members
    description: メンバーの管理と監査ログ(004)
  - name: notices
    description: お知らせ(005)、既読・配信状況・再通知(006)
  - name: demo
    description: デモモード(007)。DEMO_MODE=true のときだけ動き、それ以外は404
  - name: internal
    description: サービス間の通信(notify-relay からの送信結果)

paths:
  /api/sanctum/csrf-cookie:
    get:
      tags: [auth]
      operationId: getCsrfCookie
      summary: CSRF 対策の Cookie を受け取る
      security: []
      responses:
        '204':
          description: XSRF-TOKEN Cookie を設定した

  /api/auth/login-links:
    post:
      tags: [auth]
      operationId: requestLoginLink
      summary: ログイン用リンクをメールで送る
      description: |
        登録済みかどうかにかかわらず、同じ応答を返します(AC-001-01・02)。
        同じメールアドレスで1時間に6回以上要求すると 429 になり、メールは送りません(AC-001-05)。
        `return_to` を付けると、リンクでログインしたときの応答で同じ値を返します(AC-001-19)。
        受け付けるのは `/join?token=...` と `/settings/email/verify?token=...` の形だけで、それ以外は無視します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginLinkInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '202':
          description: メールを送った(送ることにした)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login-links/consume:
    post:
      tags: [auth]
      operationId: consumeLoginLink
      summary: メールのリンクでログインする
      description: |
        リンクは15分で失効し、1回だけ使えます(AC-001-03・04)。
        Web と同じオリジンからでない呼び出し(セッションがない)は 419 になり、リンクは使用済みになりません。
        未登録のメールアドレスなら、このときアカウントを作ります。`needs_display_name` が true なら表示名の入力画面に進みます。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '200':
          description: ログインした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '410':
          $ref: '#/components/responses/LinkExpired'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウトする
      responses:
        '204':
          description: ログアウトした(AC-001-06)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の利用者と、所属するチームの一覧
      description: どのチームにも所属していなければ `teams` は空です(AC-001-14)。
      responses:
        '200':
          description: 利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [auth]
      operationId: updateMe
      summary: 表示名を登録・変更する
      description: 初回の登録では、これでアカウントの登録が完了します(AC-001-08)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayNameInput'
      responses:
        '200':
          description: 更新後の利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/me/email-changes:
    post:
      tags: [auth]
      operationId: requestEmailChange
      summary: メールアドレスの変更を申請する
      description: |
        新しいアドレスに確認メールを送ります。リンクを開くまでは旧アドレスのままです(AC-001-09)。
        前の申請のリンクは、この時点で使えなくなります。今と同じアドレスは 422(`errors.new_email`)です。
        新しいアドレスが別のアカウントで使われていても同じ応答を返し、そのアドレスには変更できない旨だけを知らせます(AC-001-15)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEmailInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '202':
          description: 確認メールを送った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/me/email-changes/consume:
    post:
      tags: [auth]
      operationId: confirmEmailChange
      summary: 確認メールのリンクでメールアドレスの変更を確定する
      description: |
        申請した本人がログインしているときだけ確定できます(新しいアドレスを打ち間違えても、その宛先の持ち主に乗っ取られないため)。
        他人の申請のリンクは、期限切れと同じ 410 になり、使用済みにもなりません。
        変更すると、旧アドレスに「メールアドレスが変更されました」と知らせ、この端末以外のセッションと、まだ使われていない旧アドレス宛てのリンクを無効にします(AC-001-10・16)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '200':
          description: 変更した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '409':
          description: 確認の間に、新しいアドレスが別のアカウントで使われた(AC-001-17)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          $ref: '#/components/responses/LinkExpired'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams:
    post:
      tags: [teams]
      operationId: createTeam
      summary: チームを作成する
      description: |
        作成者がそのチームの代表になります。1人が代表として作成できるのは5チームまでです(AC-001-11・12)。
        上限を超えたときは 422 で、理由は `errors.team` に入ります。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamInput'
      responses:
        '403':
          $ref: '#/components/responses/DemoMode'
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: チームの情報
      responses:
        '200':
          description: チームの情報と、自分の役割
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: チーム名・競技を変える
      description: 代表だけ。送った項目だけを変えます。検査はチーム作成と同じです(AC-004-11)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamInput'
      responses:
        '200':
          description: 変えた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [members]
      operationId: listMembers
      summary: メンバー一覧
      description: 代表・役員だけ。表示名と役割だけを返します(メールアドレスは返しません、ADR-0015)。代表が先頭です。
      responses:
        '200':
          description: メンバー一覧
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/members/{membership}/roles:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/MembershipId'
    put:
      tags: [members]
      operationId: changeMemberRoles
      summary: 役割を置き換える
      description: |
        代表だけ。代表を除く役割(役員・コーチ・保護者)の一覧に置き換え、本人にメールで知らせます(AC-004-03)。
        代表のメンバーは代表のまま、ほかの役割だけが変わります。役割が1つも残らない一覧は 422 です(AC-004-09)。
        保護者を外すと、選手との紐づけも外れます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum: [officer, coach, parent]
      responses:
        '200':
          description: 変えた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/members/{membership}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/MembershipId'
    delete:
      tags: [members]
      operationId: removeMember
      summary: 除名する
      description: |
        代表・役員だけ。役員は、代表と役員の役割を持つメンバーを除名できません(403、AC-004-07)。
        自分は除名できません(422、AC-004-06)。除名すると、役割と選手との紐づけも外れます(AC-004-08)。本人にはメールしません。
      responses:
        '204':
          description: 除名した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/representative:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [members]
      operationId: transferRepresentative
      summary: 代表を交代する
      description: |
        代表だけ。役員のメンバーだけを指定できます(それ以外は 422、AC-004-05)。
        新しい代表は役員から代表に、元の代表は役員になり、両者にメールで知らせます(AC-004-04)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id:
                  type: integer
                  description: 新しい代表にするメンバーのID
      responses:
        '200':
          description: 交代した(新しい代表)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [members]
      operationId: listAuditLogs
      summary: 監査ログ
      description: 代表だけ。新しい順に100件ずつ(AC-004-12)。続きは `next_before` を `before` に渡して取ります。記録の中身(ID など)は返しません。
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 監査ログ
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logs, next_before]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  next_before:
                    type: [integer, 'null']
                    description: 続きがあるとき、次に before に渡す値
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/teams/{team}/notices:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [notices]
      operationId: listNotices
      summary: 自分宛てのお知らせ
      description: |
        自分が宛先に含まれる公開済みのお知らせを、新しい順に50件ずつ返します(AC-005-14・19)。
        続きがあれば `next_before` を返すので、`before` に渡すとそれより古いものを返します。
      parameters:
        - name: before
          in: query
          required: false
          description: このお知らせより古いものを返す
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: お知らせ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNoticeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [notices]
      operationId: createNotice
      summary: お知らせを送る(今すぐ、または予約)
      description: |
        代表・役員・コーチだけ(AC-005-01・04)。`scheduled_at` がなければ今すぐ公開し、宛先にメールを送り始めます。
        `scheduled_at` があれば、その日時まで公開しません(5分後〜30日後、AC-005-09・13)。
        宛先は公開の時点の名簿で決め、送信者本人も含みます(AC-005-03・12)。
        1人あたり1時間に10件まで。超えると 429 になります(AC-005-18)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeInput'
      responses:
        '201':
          description: 作った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams/{team}/notices/recipient-count:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [notices]
      operationId: countNoticeRecipients
      summary: 届く人数
      description: |
        代表・役員・コーチだけ。宛先の指定から、実際に届く人数(送信者本人を含む、重複なし)を返します(AC-005-02)。
        予約の編集では `notice_id` を渡すと、そのお知らせの作成者を送信者として数えます(公開のときと同じ)。
        そのお知らせを扱えない人は 403 です。1人あたり1分に30回まで。超えると 429 になります(AC-005-18)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  $ref: '#/components/schemas/NoticeTargetInput'
                notice_id:
                  type: [integer, 'null']
                  minimum: 1
                  description: 編集する予約中のお知らせ
      responses:
        '200':
          description: 人数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/teams/{team}/notices/scheduled:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [notices]
      operationId: listScheduledNotices
      summary: 予約中のお知らせ
      description: 代表・役員はチームのすべて、コーチは自分が作ったものだけ(ADR-0017)。予約日時の順。
      responses:
        '200':
          description: 予約中のお知らせ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/notices/{notice}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [notices]
      operationId: getNotice
      summary: お知らせ1件
      description: 自分が宛先に含まれる公開済みのお知らせだけ。それ以外は存在しない場合と同じ404です(AC-005-15)。
      responses:
        '200':
          description: お知らせ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [notices]
      operationId: updateScheduledNotice
      summary: 予約中のお知らせを編集する
      description: |
        作成者、または代表・役員だけ(AC-005-10)。送った項目だけを変えます。
        送信済み・取り消し済みは 409 で、`errors.notice` に理由が入ります(AC-005-06)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeChanges'
      responses:
        '200':
          description: 編集した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NoticeNotScheduled'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [notices]
      operationId: cancelScheduledNotice
      summary: 予約を取り消す
      description: 作成者、または代表・役員だけ。何も送られません(AC-005-10)。送信済みは 409 です。
      responses:
        '204':
          description: 取り消した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NoticeNotScheduled'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/teams/{team}/notices/{notice}/status:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [notices]
      operationId: getNoticeStatus
      summary: 既読・配信状況
      description: |
        代表・役員、または作成者のコーチだけ(AC-006-04・10)。送信済みのお知らせだけで、それ以外は404です。
        宛先数・既読数・未読数と、メールの状態ごとの人数を返します。送信待ちが残っていれば `state` は sending です(AC-006-07)。
        `reminders` は再通知できるかと、できない理由(interval:1時間以内、max:3回済み、no_unread:未読の人がいない)です。
      responses:
        '200':
          description: 状況
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/NoticeDeliveryStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/notices/{notice}/status/unread:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [notices]
      operationId: listUnreadNoticeRecipients
      summary: 未読の人
      description: 代表・役員、または作成者のコーチだけ(AC-006-05)。今もチームにいる人を表示名の順に返します。チームを抜けた人は `former_members` に人数だけ返します。
      responses:
        '200':
          description: 未読の人
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members, former_members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/NoticeRecipientName'
                  former_members:
                    type: integer
                    description: チームを抜けた人の人数(表示名は返さない)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/notices/{notice}/status/failures:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [notices]
      operationId: listFailedNoticeRecipients
      summary: メールが届かなかった・送らなかった人
      description: |
        代表・役員、または作成者のコーチだけ(AC-006-06)。`reason` は理由のコードで、画面で利用者向けの言葉に直します。
        failed のとき notify-relay の error_code(invalid_address、provider_rejected、provider_unavailable、rate_limited、expired)、
        skipped のとき undeliverable_address(メールが届かないアドレス)、restricted(宛先を .invalid に限る環境)、expired です。
      responses:
        '200':
          description: 届かなかった人
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members, former_members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/NoticeFailedRecipient'
                  former_members:
                    type: integer
                    description: チームを抜けた人の人数(表示名は返さない)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/{team}/notices/{notice}/reminders:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/NoticeId'
    post:
      tags: [notices]
      operationId: sendNoticeReminder
      summary: 未読の人に再通知する
      description: |
        代表・役員、または作成者のコーチだけ(AC-006-11)。実行時点で未読の、今もチームにいる人に、件名に【再通知】を付けたメールを送ります。
        メールが届かないアドレスの人などは除き、その人数を `excluded` で返します(AC-006-14)。
        前回から1時間以内、3回済み、未読の人がいないときは 409 です(AC-006-12・13・15)。
      responses:
        '201':
          description: 再通知した
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reminder]
                properties:
                  reminder:
                    type: object
                    additionalProperties: false
                    required: [number, sent, excluded]
                    properties:
                      number:
                        type: integer
                        description: 何回目か(1〜3)
                      sent:
                        type: integer
                      excluded:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReminderUnavailable'
        '419':
          $ref: '#/components/responses/CsrfExpired'

  /api/teams/{team}/invitation:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [invitations]
      operationId: getInvitation
      summary: 今の招待リンク
      description: 代表・役員だけ(AC-002-01・04)。有効なリンクがなければ `invitation` は null です。
      responses:
        '200':
          description: 今の招待リンク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [invitations]
      operationId: issueInvitation
      summary: 招待リンクを発行する
      description: 有効期限は7日。チームで有効なリンクは1つなので、古いリンクは無効になります(AC-002-01・02)。
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '401':
